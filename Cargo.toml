[workspace]
members = ["crates/rowglide-app", "crates/rowglide-core", "crates/rowglide-ui"]
resolver = "3"

[workspace.package]
description = "A native Parquet and CSV data browser built with Rust and GPUI Kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Yousa-Mirage <Yousa-Mirage@foxmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Yousa-Mirage/RowGlide"
homepage = "https://github.com/Yousa-Mirage/RowGlide"
readme = "README.md"
keywords = ["parquet", "csv", "arrow", "gpui", "data-viewer"]
categories = ["visualization", "gui"]
publish = false

[workspace.dependencies]
rowglide-app = { path = "crates/rowglide-app" }
rowglide-core = { path = "crates/rowglide-core" }

gpui-kit = "=0.9.1"
duckdb = { version = "=1.20000.1", features = ["bundled", "parquet"] }
arrow-cast = "60"
tempfile = "3"
sqlparser = "=0.64.0"
arrow-array = "60"
arrow-schema = "60"

# Lint configuration
[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Build configuration
[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
