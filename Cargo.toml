[workspace]
resolver = "3"
members = ["crates/rowglide-app", "crates/rowglide-core", "crates/rowglide-ui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
rowglide-core = { path = "crates/rowglide-core" }
rowglide-ui = { path = "crates/rowglide-ui" }

chrono = { version = "0.4.45", default-features = false, features = ["std"] }
arrow-array = "60"
arrow-cast = "60"
arrow-ipc = "60"
arrow-schema = "60"
async-channel = "2.5"
argh = { version = "0.1", default-features = false, features = ["help"] }
dirs = "7"
duckdb = { version = "=1.20000.1", features = ["bundled", "parquet"] }
futures-lite = "2.6"
gpui-kit = "=0.9.1"
serde_json = "1"
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
sqlparser = "=0.64.0"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

# Lint configuration
[workspace.lints.rust]
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"

# Project-level information, not inherited Cargo package fields.
[workspace.metadata.project]
description = "A native Parquet data browser built with Rust and GPUI Kit"
authors = ["Yousa-Mirage <Yousa-Mirage@foxmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Yousa-Mirage/RowGlide"
homepage = "https://github.com/Yousa-Mirage/RowGlide"
readme = "README.md"
keywords = ["parquet", "arrow", "gpui", "data-viewer"]
categories = ["visualization", "gui"]

# Build configuration
[profile.dev]
debug = 0

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = "thin"
codegen-units = 1
