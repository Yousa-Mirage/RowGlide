[workspace]
members = ["crates/rowglide-core", "crates/rowglide-backend", "crates/rowglide-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
rowglide-core = { path = "crates/rowglide-core" }
rowglide-backend = { path = "crates/rowglide-backend" }
gpui-kit = "=0.9.1"
arrow-array = "57"
arrow-schema = "57"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
