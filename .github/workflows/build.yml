name: Build binaries

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Bundled DuckDB compiles large C++ units; bound parallel build memory.
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake pkg-config libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev libvulkan1

      - name: Prepare Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release
          cache-workspace-crates: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: cargo build --locked --release -p rowglide-app --bin rowglide --target '${{ matrix.target }}'

      - name: Package
        run: python scripts/package-build.py --target '${{ matrix.target }}'

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: rowglide-${{ matrix.target }}
          path: target/ci-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
